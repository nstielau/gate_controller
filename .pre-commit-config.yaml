default_language_version:
  python: python3.12
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-json
      - id: check-xml
      - id: end-of-file-fixer
        exclude: '^(circuitpython/lib/\.gitkeep|hardware/|docs/superpowers/)'
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: '^(hardware/|docs/superpowers/)'
      - id: detect-private-key
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--exclude-files, '^emqxsl\\.crt$', --exclude-files, '^hardware/.*\\.kicad_(pcb|sch)$']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        files: '^(circuitpython/code\.py|circuitpython/lib/gate_indicators\.py|test_suite/test_indicators\.py|tools/test_indicators\.py)$'
